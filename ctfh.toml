# Default native launcher for this checkout.
[native]
binary = "codex"
dangerously_bypass_approvals_and_sandbox = false

# ctfh2 <URL> (네이티브 풀이기 + 검사기) 기본값. 명령줄 옵션이 우선한다.
# Uncomment these keys here, under [native], before [native.secondary].
# model = "gpt-6-sol"
# thinking = "xhigh"
# max_parallel = 0       # 동시에 여는 풀이 창 수 (0 = 전체 문제, 검사기 화면에서 +/- 로 바로 조절)
# submit = true
# rescan_model = "gpt-6-luna"  # 주기적 재스캔 모델 ("same" = model과 같음; 첫 수집은 항상 model)
# rescan_thinking = "low" # 주기적 재스캔 추론 강도 ("same" = thinking과 같음)
# submit_thinking = "low"   # 사이트 제출 작업 추론 강도 (모델은 model과 같음, "same" = thinking과 같음)
# review_thinking = "medium" # writeup 검토 추론 강도 (모델은 model과 같음, "same" = thinking과 같음)
# rescan_minutes = 60     # 새 문제·해결 상태 재수집 주기 (분, 0 = 끔)
# idle_seconds = 180
# nudge_limit = 3        # 자동 재촉·재시작 횟수, 넘거나 진전이 없으면 manual 상태로 넘김
# solve_timeout = 300
# memory_max = "auto"   # 풀이 창 전체가 함께 쓸 메모리 상한 (auto = RAM의 98%, "28G", "off")
# plain = false          # true면 검사기 화면을 키 조작 없는 텍스트 표로

# Explicit --secondary retains the previously requested secondary launch mode.
[native.secondary]
dangerously_bypass_approvals_and_sandbox = true
