[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfh-core"
version = "0.1.0"
description = "Performance-first thin supervisor for native CTF agents"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
ctfh2 = "ctfh_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
